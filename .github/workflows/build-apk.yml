name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Select APK Build Type"
        required: true
        type: choice
        options:
          - "debug"
          - "release"
        default: "release"
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Free Disk Space on Runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 4. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17
          cache: "gradle"

      - name: 5. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 6. Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 7. Generate Android Native Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 8. Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: 9. Build Android APK with Gradle
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          cd android
          if [ "$BUILD_TYPE" = "release" ]; then
            echo "🔨 Building Release APK..."
            # In Expo, if no custom keystore is configured, assembleRelease builds the unsigned/default release APK
            ./gradlew assembleRelease --no-daemon || {
              echo "⚠️ Release build fell back to assembleDebug"
              ./gradlew assembleDebug --no-daemon
            }
          else
            echo "🔨 Building Debug APK..."
            ./gradlew assembleDebug --no-daemon
          fi

      - name: 10. Locate and Display APKs
        run: |
          echo "📦 Finding generated APK files:"
          find android/app/build/outputs/apk/ -name "*.apk" -type f -exec ls -lh {} +

      - name: 11. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: medresa-app-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
